name: CI

# Runs checks on PRs and pushes. On a push to main that changes the backend,
# deploys it to EC2 after the backend tests pass (frontend deploys via Vercel).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main run mid-deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Report-only for now: the existing code has lint errors to clean up first.
      - name: Lint (report only)
        run: npm run lint
        continue-on-error: true
      - name: Build
        run: npm run build

  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/aio-fitness-backend
    # Throwaway database for this run only — never touches the real RDS.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Placeholder values so the app can start in tests. None of these are real.
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/aio_test
      SPRING_DATASOURCE_USERNAME: ci
      SPRING_DATASOURCE_PASSWORD: ci
      MAIL_USERNAME: ci@example.com
      MAIL_PASSWORD: ci-placeholder
      STRIPE_API_KEY: sk_test_placeholder
      JWT_SECRET: ci-placeholder-not-a-real-secret-0123456789abcdef0123456789abcdef
      ADMIN_USERNAME: ci
      ADMIN_PASSWORD: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw -B test

  deploy-backend:
    name: Deploy backend (EC2)
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for backend changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git diff --quiet "$BEFORE" "$GITHUB_SHA" -- backend; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No backend changes; skipping deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # The deploy key can only run /home/ubuntu/deploy.sh on the server:
      # pull main, restart the service, health-check, roll back on failure.
      - name: Deploy
        if: steps.changes.outputs.changed == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 ubuntu@3.142.50.164
